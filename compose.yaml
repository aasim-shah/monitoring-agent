# Product Control Plane — Docker Compose stack (master plan M1.3, spec §17).
# Only Caddy publishes ports. Data services live on the internal network.
name: pcp

x-node-env: &node-env
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-managed}
  BOOTSTRAP_MODE: ${BOOTSTRAP_MODE:-private_http}
  NODE_ENV: production

x-database-url: &database-url postgres://pcp_app:${PCP_APP_PASSWORD:?PCP_APP_PASSWORD must be set (see .env.example)}@postgres:5432/pcp
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}@redis:6379

services:
  caddy:
    image: caddy:2.10.2-alpine
    command:
      [
        'caddy',
        'run',
        '--config',
        '/etc/caddy/${CADDY_CONFIG:-Caddyfile.bootstrap}',
        '--adapter',
        'caddyfile',
      ]
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.example.com}
      AGENT_DOMAIN: ${AGENT_DOMAIN:-agent.example.com}
      INGEST_DOMAIN: ${INGEST_DOMAIN:-ingest.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./infrastructure/caddy:/etc/caddy:ro
      - ${AGENT_CA_DIR:-./infrastructure/caddy/agent-ca}:/etc/caddy-agent-ca:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_ADDRESS:-172.30.0.10}
    depends_on:
      api: { condition: service_healthy }
      downloads: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      <<: *node-env
      PORT: '3001'
      HOSTNAME: 0.0.0.0
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/healthz']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  migrate:
    # One-shot: bootstraps database roles as superuser, then applies migrations as pcp_migrator.
    build: { context: ., dockerfile: packages/database/Dockerfile }
    environment:
      DATABASE_SUPERUSER_URL: postgres://postgres:${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set (see .env.example)}@postgres:5432/pcp
      PCP_MIGRATOR_PASSWORD: ${PCP_MIGRATOR_PASSWORD:?PCP_MIGRATOR_PASSWORD must be set (see .env.example)}
      PCP_APP_PASSWORD: ${PCP_APP_PASSWORD:?PCP_APP_PASSWORD must be set (see .env.example)}
      PCP_SCHEDULER_PASSWORD: ${PCP_SCHEDULER_PASSWORD:?PCP_SCHEDULER_PASSWORD must be set (see .env.example)}
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *node-env
      API_PORT: '3000'
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set (see .env.example)}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Product Control Plane <no-reply@localhost>}
      # Platform AWS credentials (never customer keys); production can use workload IAM roles instead.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Google sign-in and Google data connections (one OAuth client; all three or none).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Google data connections return here (M13b); must differ from the sign-in redirect.
      GOOGLE_CONNECTIONS_REDIRECT_URI: ${GOOGLE_CONNECTIONS_REDIRECT_URI:-}
      # Shown to customers who allowlist the platform (managed databases).
      PLATFORM_EGRESS_IP: ${PLATFORM_EGRESS_IP:-}
      AGENT_PROXY_ADDRESSES: ${CADDY_ADDRESS:-172.30.0.10}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set (see .env.example)}
      VM_QUERY_URL: http://victoriametrics:8428
      ALERT_RULES_DIR: /var/lib/pcp/alert-rules
      VMALERT_URL: http://vmalert:8880
      # AI assistant (M14): platform providers; unset means AI endpoints answer 409.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PCP_AI_FAKE: ${PCP_AI_FAKE:-}
      AGENT_CA_CERT: ${AGENT_CA_CERT:-}
      AGENT_CA_KEY: ${AGENT_CA_KEY:-}
      AGENT_CA_CHAIN: ${AGENT_CA_CHAIN:-}
      TASK_SIGNING_KEY: ${TASK_SIGNING_KEY:-}
      AGENT_CONTROL_URL: ${AGENT_CONTROL_URL:-}
      # Assisted SSH install (M17.3): the runner, and the egress IPs customers allowlist for it.
      INSTALLER_RUNNER_URL: http://installer-runner:8090
      INSTALLER_EGRESS_IPS: ${INSTALLER_EGRESS_IPS:-}
      # Long-term rollups (M18.4): both set to turn routing on (the `rollups` profile must run).
      VM_LONGTERM_URL: ${VM_LONGTERM_URL:-}
      ROLLUPS_SINCE: ${ROLLUPS_SINCE:-}
      # Retained logs (M18.1): http://victorialogs:9428 with the `logs` profile.
      VLOGS_URL: ${VLOGS_URL:-}
      AGENT_INGEST_URL: ${AGENT_INGEST_URL:-}
      AGENT_OPAMP_URL: ${AGENT_OPAMP_URL:-}
    volumes: ['alert-rules:/var/lib/pcp/alert-rules']
    networks: [edge, internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/readyz']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      <<: *node-env
      WORKER_HEALTH_PORT: '3002'
      DATABASE_URL: *database-url
      SCHEDULER_DATABASE_URL: postgres://pcp_scheduler:${PCP_SCHEDULER_PASSWORD:?PCP_SCHEDULER_PASSWORD must be set (see .env.example)}@postgres:5432/pcp
      REDIS_URL: *redis-url
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set (see .env.example)}
      # Incident notifications (M12.3).
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Product Control Plane <no-reply@localhost>}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      # Website probe samples (M13a).
      VM_IMPORT_URL: http://victoriametrics:8428
      # Daily reports (M15): numbers from telemetry, narrative from the AI assistant's providers.
      VM_QUERY_URL: http://victoriametrics:8428
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PCP_AI_FAKE: ${PCP_AI_FAKE:-}
      # Platform AWS credentials (never customer keys); production can use workload IAM roles instead.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Google KPI sync refreshes access tokens with the platform OAuth client (M13b).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # egress: managed databases and provider APIs are on the internet; internal has no route out.
    networks: [internal, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3002/readyz']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pcp
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set (see .env.example)}
    volumes: [pg-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pcp']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}',
        '--appendonly',
        'yes',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=15d
      - -dedup.minScrapeInterval=1s
      # Show samples 5 s after arrival (default 30 s), so a new host's metrics appear within a minute.
      - -search.latencyOffset=5s
      - -httpListenAddr=:8428
    volumes: [vm-data:/storage]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8428/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  vmalert:
    image: victoriametrics/vmalert:v1.126.0
    command:
      - -datasource.url=http://victoriametrics:8428
      - -rule=/etc/vmalert/rules/*.yaml
      # Tenant groups compiled by the api (M12.1, D17); re-read every minute and on /-/reload.
      - -rule=/etc/vmalert/tenants/*.yaml
      - -configCheckInterval=1m
      - -evaluationInterval=1m
      # Firing and resolved alerts go to the api's internal Alertmanager-compatible receiver (M12.2).
      - -notifier.url=http://api:3000/internal/alertmanager
      - -notifier.headers=X-Internal-Token:${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set (see .env.example)}
      - -external.url=${APP_ORIGIN:-http://localhost:8080}
      - -httpListenAddr=:8880
    volumes:
      - ./infrastructure/telemetry/rules:/etc/vmalert/rules:ro
      - alert-rules:/etc/vmalert/tenants:ro
    networks: [internal]
    depends_on:
      victoriametrics: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8880/health']
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Retained logs (M18.1), off unless the `logs` profile runs and VLOGS_URL points here: redacted
  # lines from opted-in packs, 7 days, tenant-isolated by AccountID (BR-12-08).
  victorialogs:
    profiles: [logs]
    image: victoriametrics/victoria-logs:v1.51.1
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
      - -httpListenAddr=:9428
    volumes: [vlogs-data:/storage]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9428/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  # Long-term rollups (M18.4), off unless the `rollups` profile is started: 5-minute aggregates kept
  # 13 months. The api reads them for ranges older than raw retention when ROLLUPS_SINCE is set.
  victoriametrics-longterm:
    profiles: [rollups]
    image: victoriametrics/victoria-metrics:v1.126.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=13
      - -httpListenAddr=:8428
    volumes: [vm-longterm-data:/storage]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8428/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  vmalert-rollups:
    profiles: [rollups]
    image: victoriametrics/vmalert:v1.126.0
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics-longterm:8428
      - -rule=/etc/vmalert/rollups/*.yaml
      - -evaluationInterval=5m
      - -httpListenAddr=:8881
    volumes:
      - ./infrastructure/telemetry/rollups:/etc/vmalert/rollups:ro
    networks: [internal]
    depends_on:
      victoriametrics: { condition: service_healthy }
      victoriametrics-longterm: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8881/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 64m } } }
    restart: unless-stopped

  opamp-server:
    build: { context: ., dockerfile: apps/opamp-server/Dockerfile }
    environment:
      OPAMP_PORT: '4320'
    networks: [edge, internal]
    healthcheck:
      test: ['CMD', '/app/service', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # install.sh and agent release artifacts (M6.7); built from agents/release/Dockerfile.
  downloads:
    build: { context: ., dockerfile: agents/release/Dockerfile, target: downloads }
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 64m } } }
    restart: unless-stopped

  ingest-gateway:
    build: { context: ., dockerfile: apps/ingest-gateway/Dockerfile }
    environment:
      INGEST_PORT: '4318'
      VM_WRITE_URL: http://victoriametrics:8428/api/v1/write
      API_INTERNAL_URL: http://api:3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set (see .env.example)}
      TRUSTED_PROXY_ADDRESSES: ${CADDY_ADDRESS:-172.30.0.10}
      VLOGS_URL: ${VLOGS_URL:-}
    networks: [edge, internal]
    depends_on:
      victoriametrics: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/app/service', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # Assisted SSH installs (M17.3): keys and tokens in memory only; reaches customer servers over
  # egress (from the published INSTALLER_EGRESS_IPS) and reports to the API on internal.
  installer-runner:
    build: { context: ., dockerfile: apps/installer-runner/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set (see .env.example)}
    networks: [internal, egress]
    healthcheck:
      test: ['CMD', '/app/service', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 6
    deploy: { resources: { limits: { memory: 32m } } }
    restart: unless-stopped

networks:
  # Fixed subnet so the API can trust X-Client-Cert-Fingerprint only from Caddy's address (D10).
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
  internal:
    internal: true
  # Outbound internet for the worker only (connectors); nothing listens on it.
  egress: {}

volumes:
  # Tenant vmalert rule files: the api writes them, vmalert reads them (M12.1).
  alert-rules: {}
  caddy-data: {}
  caddy-config: {}
  pg-data: {}
  redis-data: {}
  vm-data: {}
  vm-longterm-data: {}
  vlogs-data: {}
