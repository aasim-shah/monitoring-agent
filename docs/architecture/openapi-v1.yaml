components:
  securitySchemes:
    sessionCookie:
      {
        type: apiKey,
        in: cookie,
        name: pcp_session,
        description: 'Session cookie (httpOnly, Secure, SameSite=Lax)',
      }
    agentMtls: { type: mutualTLS, description: Agent client certificate issued at enrollment }
    webhookSignature:
      {
        type: apiKey,
        in: header,
        name: X-Webhook-Signature,
        description: Provider-specific signature header verified per connection,
      }
    internalToken:
      {
        type: apiKey,
        in: header,
        name: X-Internal-Token,
        description: Shared secret for private-network service calls,
      }
  parameters:
    orgId: { name: orgId, in: path, required: true, description: Organization ID, schema: { type: string } }
    productId:
      { name: productId, in: path, required: true, description: Product ID, schema: { type: string } }
    id: { name: id, in: path, required: true, description: Resource ID, schema: { type: string } }
    environmentId:
      { name: environmentId, in: path, required: true, description: Environment ID, schema: { type: string } }
    memberId:
      { name: memberId, in: path, required: true, description: Membership ID, schema: { type: string } }
    packId:
      { name: packId, in: path, required: true, description: Monitoring pack ID, schema: { type: string } }
    provider:
      {
        name: provider,
        in: path,
        required: true,
        description: 'Provider key (e.g. google, github, cloudflare)',
        schema: { type: string },
      }
    connectionId:
      { name: connectionId, in: path, required: true, description: Connection ID, schema: { type: string } }
    hostId:
      {
        name: hostId,
        in: path,
        required: true,
        description: Install-session host ID,
        schema: { type: string },
      }
    fp:
      {
        name: fp,
        in: path,
        required: true,
        description: Client certificate SHA-256 fingerprint,
        schema: { type: string },
      }
    sessionId:
      { name: sessionId, in: path, required: true, description: Stream session ID, schema: { type: string } }
    type:
      {
        name: type,
        in: path,
        required: true,
        description: Action type (e.g. cloudflare.purge_cache),
        schema: { type: string },
      }
  schemas:
    ReportSchedule:
      type: object
      required: [id, productId, name, timezone, localTime, channelIds, recipients, enabled, nextRunAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        template: { type: string, enum: [daily] }
        timezone: { type: string }
        localTime: { type: string }
        channelIds: { type: array, items: { type: string, format: uuid } }
        recipients: { type: array, items: { type: string } }
        enabled: { type: boolean }
        nextRunAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ReportSummary:
      type: object
      required: [id, productId, localDate, version, narrativeStatus, late, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid, nullable: true }
        scheduleName: { type: string, nullable: true }
        localDate: { type: string, format: date }
        version: { type: integer }
        narrativeStatus: { type: string, enum: [verified, deferred, disabled] }
        late: { type: boolean }
        createdAt: { type: string, format: date-time }
    ReportSection:
      type: object
      required: [id, key, title, status]
      properties:
        id: { type: string, description: 'Citation ID, S1–S12' }
        key: { type: string }
        title: { type: string }
        status: { type: string, enum: [ok, missing] }
        data: {}
        reason: { type: string }
    Report:
      allOf:
        - { $ref: '#/components/schemas/ReportSummary' }
        - type: object
          required: [timezone, windowStart, windowEnd, snapshot, deliveries]
          properties:
            timezone: { type: string }
            windowStart: { type: string, format: date-time }
            windowEnd: { type: string, format: date-time }
            narrative: { type: string, nullable: true }
            problems: { type: array, items: { type: string } }
            snapshot:
              type: object
              required: [window, sections, anomalies, actions, coverage]
              properties:
                window:
                  type: object
                  required: [timezone, localDate, start, end, hours]
                  properties:
                    timezone: { type: string }
                    localDate: { type: string }
                    start: { type: string }
                    end: { type: string }
                    hours: { type: integer }
                sections: { type: array, items: { $ref: '#/components/schemas/ReportSection' } }
                anomalies:
                  type: array
                  items:
                    type: object
                    required: [metric, previous, current, changePercent]
                    properties:
                      metric: { type: string }
                      previous: { type: number }
                      current: { type: number }
                      changePercent: { type: number }
                actions: { type: array, items: { type: string } }
                coverage:
                  type: array
                  items:
                    type: object
                    required: [source, status]
                    properties:
                      source: { type: string }
                      status: { type: string, enum: [ok, partial, missing] }
                      reason: { type: string }
            deliveries:
              type: array
              items:
                type: object
                required: [id, kind, target, status, attempts]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string, enum: [email, slack, webhook] }
                  target: { type: string }
                  channelId: { type: string, format: uuid, nullable: true }
                  status: { type: string, enum: [pending, sent, failed, dead] }
                  attempts: { type: integer }
                  lastError: { type: string, nullable: true }
                  sentAt: { type: string, format: date-time, nullable: true }
    ActionPolicy:
      type: object
      required: [environmentId, capability, enabled, approverRoles, requireApproval, settings]
      properties:
        id: { type: string, format: uuid, nullable: true }
        environmentId: { type: string, format: uuid }
        environmentName: { type: string }
        production: { type: boolean }
        capability: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        approverRoles: { type: array, items: { type: string } }
        requireApproval: { type: boolean }
        settings: { type: object, additionalProperties: true }
        available:
          {
            type: boolean,
            description: False until the capability's connection type exists (Cloudflare,
            GitHub).,
          }
    ActionExecution:
      type: object
      required: [id, location, adapter, adapterVersion, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        location: { type: string, enum: [agent, platform] }
        adapter: { type: string }
        adapterVersion: { type: string }
        agentTaskId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [running, succeeded, failed, expired] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        result: { type: object, nullable: true, additionalProperties: true }
        verification: { type: object, nullable: true, additionalProperties: true }
        error: { type: string, nullable: true }
    ActionRequest:
      type: object
      required:
        [id, productId, environmentId, capability, target, params, status, proposedByAi, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        capability: { type: string }
        target: { type: object, additionalProperties: true }
        params: { type: object, additionalProperties: true }
        status:
          {
            type: string,
            enum:
              [
                proposed,
                rejected_policy,
                pending_approval,
                approved,
                executing,
                succeeded,
                failed,
                rejected,
                expired,
              ],
          }
        reason: { type: string, nullable: true }
        impact: { type: object, additionalProperties: true }
        proposedByAi: { type: boolean }
        requestedByUserId: { type: string, format: uuid, nullable: true }
        incidentId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              userId: { type: string, format: uuid }
              decision: { type: string, enum: [approve, reject] }
              note: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
        executions: { type: array, items: { $ref: '#/components/schemas/ActionExecution' } }
    WebsiteMonitor:
      type: object
      required: [id, productId, url, host, intervalSeconds, status, verification]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        url: { type: string }
        host: { type: string }
        intervalSeconds: { type: integer }
        expectedStatus: { type: integer, nullable: true }
        status: { type: string, enum: [pending_verification, active, paused] }
        pausedReason: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        verification:
          type: object
          required: [record, name, value]
          properties:
            record: { type: string, enum: [TXT] }
            name: { type: string }
            value: { type: string }
        last:
          type: object
          nullable: true
          properties:
            checkedAt: { type: string, format: date-time }
            up: { type: boolean, nullable: true }
            statusCode: { type: integer, nullable: true }
            error: { type: string, nullable: true }
            totalMs: { type: integer, nullable: true }
            consecutiveFailures: { type: integer }
        tls:
          type: object
          nullable: true
          properties:
            expiresAt: { type: string, format: date-time }
            issuer: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AiSettings:
      type: object
      required: [disabled, available]
      properties:
        disabled: { type: boolean }
        available: { type: boolean, description: A platform provider is configured. }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
    AiMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        evidence:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              tool: { type: string }
              status: { type: string, enum: [ok, denied, error, truncated] }
              gaps: { type: array, items: { type: string } }
              sources:
                {
                  type: array,
                  items: { type: object, properties: { label: { type: string }, href: { type: string } } },
                }
              data: {}
        missing: { type: array, items: { type: string } }
        confidence: { type: string, nullable: true, enum: [high, medium, low] }
        validation: { type: string, nullable: true, enum: [verified, unverified, partial] }
        createdAt: { type: string, format: date-time }
    AlertTemplate:
      type: object
      required: [id, label, description, kind, params, defaultSeverity]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        kind: { type: string, enum: [metric, heartbeat, connection] }
        defaultSeverity: { type: string, enum: [critical, warning, info] }
        params:
          type: array
          items:
            type: object
            required: [name, label, unit, min, max, default]
            properties:
              name: { type: string }
              label: { type: string }
              unit: { type: string }
              min: { type: number }
              max: { type: number }
              default: { type: number }
    AlertRule:
      type: object
      required: [id, productId, name, template, params, severity, enabled]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        template: { type: string }
        params: { type: object, additionalProperties: { type: number } }
        severity: { type: string, enum: [critical, warning, info] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertRuleList:
      type: object
      required: [rules, templates]
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
        templates: { type: array, items: { $ref: '#/components/schemas/AlertTemplate' } }
    Incident:
      type: object
      required: [id, productId, ruleId, title, severity, status, summary, labels, startedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid, nullable: true }
        ruleId: { type: string, format: uuid }
        title: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        status: { type: string, enum: [open, acknowledged, resolved] }
        summary: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        startedAt: { type: string, format: date-time }
        lastFiredAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        acknowledgedByUserId: { type: string, format: uuid, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolutionNote: { type: string, nullable: true }
        escalatedAt: { type: string, format: date-time, nullable: true }
        postmortem:
          type: object
          nullable: true
          properties:
            summary: { type: string }
            causeCategory: { type: string }
            followUps: { type: array, items: { type: string } }
    IncidentDetail:
      type: object
      required: [incident, events, correlation, changes, sourceLinks]
      properties:
        incident: { $ref: '#/components/schemas/Incident' }
        events:
          type: array
          items:
            type: object
            required: [kind, at]
            properties:
              kind:
                {
                  type: string,
                  enum:
                    [fired, refired, reopened, acknowledged, resolved, notified, suppressed, escalated, note],
                }
              detail: { type: object }
              at: { type: string, format: date-time }
        correlation:
          type: object
          required: [assets, counts]
          properties:
            host:
              type: object
              nullable: true
              properties: { id: { type: string }, name: { type: string } }
            assets:
              type: array
              items:
                type: object
                required: [assetId, name, assetType, impact, distance]
                properties:
                  assetId: { type: string, format: uuid }
                  name: { type: string }
                  assetType: { type: string }
                  impact: { type: string, enum: [confirmed, potential, unknown] }
                  distance: { type: integer }
            counts: { type: object, additionalProperties: { type: integer } }
        changes: { type: array, items: { type: object } }
        sourceLinks:
          type: array
          items:
            type: object
            required: [label, href]
            properties: { label: { type: string }, href: { type: string } }
    NotificationChannel:
      type: object
      required: [id, name, kind, escalation, status, consecutiveFailures]
