  /api/v1/actions/proposals:
    post:
      operationId: proposeAction
      tags: [actions]
      summary: Propose an action
      description: >-
        Validates the target, checks the policy, assesses impact from the asset graph, and returns the request:
        `rejected_policy`, `pending_approval`, or (non-production, policy without approval) `executing`. The same
        idempotency key returns the original request. Host restarts need agent 0.3.0 with pcp-helper (409
        agent_upgrade_required); Cloudflare and GitHub actions need their connection (409 connection_required).
        Requires `action.propose`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, environmentId, capability, target, idempotencyKey]
              properties:
                productId: { type: string, format: uuid }
                environmentId: { type: string, format: uuid }
                capability:
                  {
                    type: string,
                    enum: [host.restart_service, cloudflare.purge_cache, github.workflow_dispatch],
                  }
                target:
                  {
                    type: object,
                    additionalProperties: true,
                    example: { agentId: 7b3c8f2a-1d4e-4c5b-9a6f-0e1d2c3b4a59 },
                  }
                params: { type: object, additionalProperties: true, example: { unit: api.service } }
                idempotencyKey: { type: string, minLength: 8 }
                reason: { type: string }
                incidentId: { type: string, format: uuid }
      responses:
        '201':
          description: Created (or the original request for a repeated key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
