components:
  securitySchemes:
    sessionCookie:
      {
        type: apiKey,
        in: cookie,
        name: pcp_session,
        description: 'Session cookie (httpOnly, Secure, SameSite=Lax)',
      }
    agentMtls: { type: mutualTLS, description: Agent client certificate issued at enrollment }
    webhookSignature:
      {
        type: apiKey,
        in: header,
        name: X-Webhook-Signature,
        description: Provider-specific signature header verified per connection,
      }
    internalToken:
      {
        type: apiKey,
        in: header,
        name: X-Internal-Token,
        description: Shared secret for private-network service calls,
      }
  parameters:
    orgId: { name: orgId, in: path, required: true, description: Organization ID, schema: { type: string } }
    productId:
      { name: productId, in: path, required: true, description: Product ID, schema: { type: string } }
    id: { name: id, in: path, required: true, description: Resource ID, schema: { type: string } }
    environmentId:
      { name: environmentId, in: path, required: true, description: Environment ID, schema: { type: string } }
    memberId:
      { name: memberId, in: path, required: true, description: Membership ID, schema: { type: string } }
    packId:
      { name: packId, in: path, required: true, description: Monitoring pack ID, schema: { type: string } }
    provider:
      {
        name: provider,
        in: path,
        required: true,
        description: 'Provider key (e.g. google, github, cloudflare)',
        schema: { type: string },
      }
    connectionId:
      { name: connectionId, in: path, required: true, description: Connection ID, schema: { type: string } }
    hostId:
      {
        name: hostId,
        in: path,
        required: true,
        description: Install-session host ID,
        schema: { type: string },
      }
    fp:
      {
        name: fp,
        in: path,
        required: true,
        description: Client certificate SHA-256 fingerprint,
        schema: { type: string },
      }
    sessionId:
      { name: sessionId, in: path, required: true, description: Stream session ID, schema: { type: string } }
    type:
      {
        name: type,
        in: path,
        required: true,
        description: Action type (e.g. cloudflare.purge_cache),
        schema: { type: string },
      }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 256
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - mfaRequired
      properties:
        mfaRequired:
          type: boolean
    TokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12
    Accepted:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
    MfaEnrollResponse:
      type: object
      required:
        - secret
        - otpauthUri
      properties:
        secret: &a1
          type: string
        otpauthUri: *a1
    MfaVerifyRequest:
      type: object
      required: []
      properties:
        code:
          type: string
          pattern: ^\d{6}$
        recoveryCode:
          type: string
    MfaVerifyResponse:
      type: object
      required: []
      properties:
        recoveryCodes:
          type: array
          items: &a2
            type: string
        status: *a2
    Me:
      type: object
      required:
        - user
        - memberships
        - session
      properties:
        user:
          type: object
          required:
            - id
            - email
            - mfaEnabled
          properties:
            id: &a3
              type: string
              format: uuid
            email: &a4
              type: string
            mfaEnabled:
              type: boolean
        memberships:
          type: array
          items:
            type: object
            required:
              - organizationId
              - organizationName
              - role
              - productIds
            properties:
              organizationId: *a3
              organizationName: *a4
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - operator
                  - analyst
                  - viewer
              productIds:
                oneOf:
                  - type: string
                    const: all
                  - type: array
                    items: *a3
        session:
          type: object
          required:
            - mfaVerified
          properties:
            mfaVerified:
              type: boolean
    CreateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          description: IANA timezone; default UTC
    UpdateSettingsRequest:
      type: object
      required: []
      properties:
        name: &a5
          type: string
        timezone: *a5
        settings:
          type: object
          required: []
          properties:
            dataRetentionDays:
              type: integer
              minimum: 1
              maximum: 3650
    Organization:
      type: object
      required:
        - id
        - name
        - timezone
        - settings
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name: &a6
          type: string
        timezone: *a6
        settings:
          type: object
        createdAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        name: &a7
          type: string
        description: *a7
        domains:
          type: array
          items: *a7
        repositories:
          type: array
          items: *a7
    Environment:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Product:
      type: object
      required:
        - id
        - name
        - domains
        - repositories
      properties:
        id:
          type: string
          format: uuid
        name: &a8
          type: string
        description: *a8
        domains:
          type: array
          items: *a8
        repositories:
          type: array
          items: *a8
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
    CreateEnvironmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    CreateInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        productIds:
          type: array
          items:
            type: string
            format: uuid
          description: Omit for all products
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationResponse:
      type: object
      required:
        - organizationId
        - role
      properties:
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
    Member:
      type: object
      required:
        - id
        - userId
        - email
        - role
        - productIds
        - createdAt
      properties:
        id: &a9
          type: string
          format: uuid
        userId: *a9
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        productIds:
          oneOf:
            - type: string
              const: all
            - type: array
              items: *a9
        createdAt:
          type: string
          format: date-time
    UpdateMemberRequest:
      type: object
      required: []
      properties:
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        productIds:
          oneOf:
            - type: string
              const: all
            - type: array
              items:
                type: string
                format: uuid
    AuditEntry:
      type: object
      required:
        - id
        - action
        - actorType
        - targetType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action: &a10
          type: string
        actorType: *a10
        actorId: *a10
        targetType: *a10
        targetId: *a10
        metadata:
          type: object
        requestId: *a10
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required:
        - entries
        - nextBefore
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextBefore:
          type:
            - string
            - 'null'
    ProductSummary:
      type: object
      required:
        - id
        - name
        - domains
        - repositories
        - environmentCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        domains:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            type: string
        environmentCount:
          type: integer
    ProductList:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
    MemberList:
      type: object
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    ProductOverview:
      type: object
      required:
        - product
        - environments
        - counts
      properties:
        product:
          $ref: '#/components/schemas/Product'
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
        counts:
          type: object
          required:
            - environments
          properties:
            environments:
              type: integer
    ConnectorCatalog:
      type: object
      required: [connectors]
      properties:
        connectors:
          type: array
          items:
            type: object
            required: [type, version, displayName, capabilities, executionLocations, configSchema]
            properties:
              type: { type: string }
              version: { type: string }
              displayName: { type: string }
              capabilities: { type: array, items: { type: string } }
              executionLocations: { type: array, items: { type: string, enum: [cloud, private] } }
              credentialFields:
                type: array
                items:
                  type: object
                  required: [name, label, secret]
                  properties:
                    name: { type: string }
                    label: { type: string }
                    secret: { type: boolean }
              configSchema: { type: object, additionalProperties: true }
    CreateConnectionRequest:
      type: object
      required: [provider, displayName, executionLocation]
      properties:
        provider: { type: string, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        executionLocation: { type: string, enum: [cloud, private] }
        config:
          {
            type: object,
            additionalProperties: true,
            description: Non-secret configuration validated by the connector,
          }
    AuthorizeConnectionRequest:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: object
          description: Values for the connector's credentialFields; encrypted at rest and never returned
          additionalProperties: { type: string }
    ResourceScope:
      type: object
      required: [externalId, resourceType, name, productId]
      properties:
        externalId: { type: string }
        resourceType: { type: string }
        name: { type: string }
        productId: { type: string, format: uuid }
        environmentId: { type: [string, 'null'], format: uuid }
    Connection:
      type: object
      required:
        [
          id,
          provider,
          displayName,
          executionLocation,
          status,
          statusReason,
          config,
          lastValidatedAt,
          createdAt,
          scopes,
        ]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        displayName: { type: string }
        executionLocation: { type: string, enum: [cloud, private] }
        status:
          type: string
          enum: [draft, pending_auth, pending_validation, connected, degraded, revoked, disconnected]
        statusReason: { type: [string, 'null'] }
        config: { type: object, additionalProperties: true }
        lastValidatedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        scopes: { type: array, items: { $ref: '#/components/schemas/ResourceScope' } }
    ConnectionDetail:
      allOf:
        - $ref: '#/components/schemas/Connection'
        - type: object
          required: [hasCredentials]
          properties:
            hasCredentials: { type: boolean }
    ConnectionList:
      type: object
      required: [connections]
      properties:
        connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
    ConnectionDeleted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [disconnected, revoked] }
    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }
    ConnectionResourceList:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items:
            type: object
            required: [externalId, resourceType, name]
            properties:
              externalId: { type: string }
              resourceType: { type: string }
              name: { type: string }
    ResourceScopesRequest:
      type: object
      required: [scopes]
      properties:
        scopes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ResourceScope' } }
    ResourceScopeList:
      type: object
      required: [scopes]
      properties:
        scopes: { type: array, items: { $ref: '#/components/schemas/ResourceScope' } }
    SyncRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            type: object
            required: [id, kind, status, createdAt]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [validate, discover, sync] }
              status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
              startedAt: { type: [string, 'null'], format: date-time }
              finishedAt: { type: [string, 'null'], format: date-time }
              errorCode: { type: [string, 'null'] }
              errorMessage: { type: [string, 'null'], description: Redacted before storage }
              items: { type: [integer, 'null'] }
              createdAt: { type: string, format: date-time }
    CreateAgentEnrollmentRequest:
      type: object
      properties:
        agentType: { type: string, enum: [host, private_worker], default: host }
        maxUses:
          {
            type: integer,
            minimum: 1,
            maximum: 1000,
            default: 1,
            description: Number of hosts that may use this token,
          }
        expiresInMinutes: { type: integer, minimum: 5, maximum: 1440, default: 60 }
    AgentEnrollmentCreated:
      type: object
      required: [id, token, expiresAt, maxUses, installCommand]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: Shown once; only a peppered hash is stored }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }
        installCommand: { type: string }
    AgentEnrollmentList:
      type: object
      required: [enrollments]
      properties:
        enrollments:
          type: array
          items:
            type: object
            required: [id, agentType, expiresAt, maxUses, uses, revokedAt, createdAt]
            properties:
              id: { type: string, format: uuid }
              agentType: { type: string, enum: [host, private_worker] }
              expiresAt: { type: string, format: date-time }
              maxUses: { type: integer }
              uses: { type: integer }
              revokedAt: { type: [string, 'null'], format: date-time }
              createdAt: { type: string, format: date-time }
    AgentSummary:
      type: object
      required:
        [
          id,
          hostname,
          os,
          arch,
          agentVersion,
          environmentId,
          environmentName,
          status,
          stale,
          lastHeartbeatAt,
          clockSkewSeconds,
          duplicateMachineId,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        agentVersion: { type: string }
        environmentId: { type: string, format: uuid }
        environmentName: { type: string }
        status: { type: string, enum: [active, degraded, revoked] }
        stale: { type: boolean }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        clockSkewSeconds: { type: [integer, 'null'] }
        duplicateMachineId: { type: boolean }
        createdAt: { type: string, format: date-time }
    AgentDetail:
      allOf:
        - $ref: '#/components/schemas/AgentSummary'
        - type: object
          required: [capabilities, policyVersion, x25519PublicKey, certificate, recentHeartbeats]
          properties:
            capabilities: { type: array, items: { type: string } }
            policyVersion: { type: integer }
            x25519PublicKey:
              { type: [string, 'null'], description: base64; pack credentials are sealed to it }
            certificate:
              type: [object, 'null']
              required: [notAfter, fingerprintSha256]
              properties:
                notAfter: { type: string, format: date-time }
                fingerprintSha256: { type: string }
            recentHeartbeats:
              type: array
              items:
                type: object
                required: [receivedAt, health, queueDepth]
                properties:
                  receivedAt: { type: string, format: date-time }
                  health: { type: string }
                  queueDepth: { type: integer }
    MonitoringPack:
      type: object
      required: [id, name, description, defaultEndpoint, credentialFields, settings]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultEndpoint: { type: [string, 'null'] }
        credentialFields:
          type: array
          items:
            type: object
            required: [name, label, secret, required]
            properties:
              name: { type: string }
              label: { type: string }
              secret: { type: boolean }
              required: { type: boolean }
        settings: { type: object, additionalProperties: true, description: JSON Schema of the pack settings }
    PackAssignment:
      type: object
      required: [packId, settings, status, statusMessage, policyVersion, appliedAt, updatedAt]
      properties:
        packId: { type: string }
        settings: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, applied, failed, removing] }
        statusMessage: { type: [string, 'null'] }
        policyVersion: { type: integer }
        appliedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    Inventory:
      type: object
      required: [collectedAt, services, listeners, warnings]
      properties:
        collectedAt: { type: string, format: date-time }
        services:
          type: array
          items:
            type: object
            required: [pack, name, ports, processCount, evidence]
            properties:
              pack: { type: string }
              name: { type: string }
              ports: { type: array, items: { $ref: '#/components/schemas/ListenAddress' } }
              processCount: { type: integer }
              evidence: { type: array, items: { type: string } }
        listeners: { type: array, items: { $ref: '#/components/schemas/ListenAddress' } }
        warnings:
          type: array
          items:
            type: object
            required: [kind, pack, address, port]
            properties:
              kind: { type: string, enum: [exposed_service] }
              pack: { type: string }
              address: { type: string }
              port: { type: integer }
    ListenAddress:
      type: object
      required: [address, port]
      properties:
        address: { type: string }
        port: { type: integer }
    MetricPoint:
      type: array
      description: '[epochSeconds, value]; value is null for a step without data (never shown as zero)'
      minItems: 2
      maxItems: 2
      items: { type: [number, 'null'] }
  responses:
    Ok: { description: Success }
    Created: { description: Created }
    Accepted: { description: Accepted for asynchronous processing }
    NoContent: { description: No content }
    Redirect: { description: Redirect }
    SwitchingProtocols: { description: Protocol upgrade (WebSocket) }
    NotImplemented: { description: Not implemented yet }
    Unauthorized:
      description: Authentication required or failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found or not in caller scope (never 403, to avoid existence leaks)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Validation failed or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but refused (e.g. mfa_required, email_not_verified, role_above_actor, forbidden_origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict (e.g. product_exists, environment_exists, last_owner, already_member)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; see Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
