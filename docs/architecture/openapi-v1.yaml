components:
  securitySchemes:
    sessionCookie:
      {
        type: apiKey,
        in: cookie,
        name: pcp_session,
        description: 'Session cookie (httpOnly, Secure, SameSite=Lax)',
      }
    agentMtls: { type: mutualTLS, description: Agent client certificate issued at enrollment }
    webhookSignature:
      {
        type: apiKey,
        in: header,
        name: X-Webhook-Signature,
        description: Provider-specific signature header verified per connection,
      }
    internalToken:
      {
        type: apiKey,
        in: header,
        name: X-Internal-Token,
        description: Shared secret for private-network service calls,
      }
  parameters:
    orgId: { name: orgId, in: path, required: true, description: Organization ID, schema: { type: string } }
    productId:
      { name: productId, in: path, required: true, description: Product ID, schema: { type: string } }
    id: { name: id, in: path, required: true, description: Resource ID, schema: { type: string } }
    memberId:
      { name: memberId, in: path, required: true, description: Membership ID, schema: { type: string } }
    packId:
      { name: packId, in: path, required: true, description: Monitoring pack ID, schema: { type: string } }
    provider:
      {
        name: provider,
        in: path,
        required: true,
        description: 'Provider key (e.g. google, github, cloudflare)',
        schema: { type: string },
      }
    connectionId:
      { name: connectionId, in: path, required: true, description: Connection ID, schema: { type: string } }
    hostId:
      {
        name: hostId,
        in: path,
        required: true,
        description: Install-session host ID,
        schema: { type: string },
      }
    fp:
      {
        name: fp,
        in: path,
        required: true,
        description: Client certificate SHA-256 fingerprint,
        schema: { type: string },
      }
    sessionId:
      { name: sessionId, in: path, required: true, description: Stream session ID, schema: { type: string } }
    type:
      {
        name: type,
        in: path,
        required: true,
        description: Action type (e.g. cloudflare.purge_cache),
        schema: { type: string },
      }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 256
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - mfaRequired
      properties:
        mfaRequired:
          type: boolean
    TokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12
    Accepted:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
    MfaEnrollResponse:
      type: object
      required:
        - secret
        - otpauthUri
      properties:
        secret: &a1
          type: string
        otpauthUri: *a1
    MfaVerifyRequest:
      type: object
      required: []
      properties:
        code:
          type: string
          pattern: ^\d{6}$
        recoveryCode:
          type: string
    MfaVerifyResponse:
      type: object
      required: []
      properties:
        recoveryCodes:
          type: array
          items: &a2
            type: string
        status: *a2
    Me:
      type: object
      required:
        - user
        - memberships
        - session
      properties:
        user:
          type: object
          required:
            - id
            - email
            - mfaEnabled
          properties:
            id: &a3
              type: string
              format: uuid
            email: &a4
              type: string
            mfaEnabled:
              type: boolean
        memberships:
          type: array
          items:
            type: object
            required:
              - organizationId
              - organizationName
              - role
              - productIds
            properties:
              organizationId: *a3
              organizationName: *a4
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - operator
                  - analyst
                  - viewer
              productIds:
                oneOf:
                  - type: string
                    const: all
                  - type: array
                    items: *a3
        session:
          type: object
          required:
            - mfaVerified
          properties:
            mfaVerified:
              type: boolean
    CreateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          description: IANA timezone; default UTC
    UpdateSettingsRequest:
      type: object
      required: []
      properties:
        name: &a5
          type: string
        timezone: *a5
        settings:
          type: object
          required: []
          properties:
            dataRetentionDays:
              type: integer
              minimum: 1
              maximum: 3650
    Organization:
      type: object
      required:
        - id
        - name
        - timezone
        - settings
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name: &a6
          type: string
        timezone: *a6
        settings:
          type: object
        createdAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        name: &a7
          type: string
        description: *a7
        domains:
          type: array
          items: *a7
        repositories:
          type: array
          items: *a7
    Environment:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Product:
      type: object
      required:
        - id
        - name
        - domains
        - repositories
      properties:
        id:
          type: string
          format: uuid
        name: &a8
          type: string
        description: *a8
        domains:
          type: array
          items: *a8
        repositories:
          type: array
          items: *a8
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
    CreateEnvironmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    CreateInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        productIds:
          type: array
          items:
            type: string
            format: uuid
          description: Omit for all products
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationResponse:
      type: object
      required:
        - organizationId
        - role
      properties:
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
    Member:
      type: object
      required:
        - id
        - userId
        - email
        - role
        - productIds
        - createdAt
      properties:
        id: &a9
          type: string
          format: uuid
        userId: *a9
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        productIds:
          oneOf:
            - type: string
              const: all
            - type: array
              items: *a9
        createdAt:
          type: string
          format: date-time
    UpdateMemberRequest:
      type: object
      required: []
      properties:
        role:
          type: string
          enum:
            - owner
            - admin
            - operator
            - analyst
            - viewer
        productIds:
          oneOf:
            - type: string
              const: all
            - type: array
              items:
                type: string
                format: uuid
    AuditEntry:
      type: object
      required:
        - id
        - action
        - actorType
        - targetType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action: &a10
          type: string
        actorType: *a10
        actorId: *a10
        targetType: *a10
        targetId: *a10
        metadata:
          type: object
        requestId: *a10
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required:
        - entries
        - nextBefore
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextBefore:
          type:
            - string
            - 'null'
  responses:
    Ok: { description: Success }
    Created: { description: Created }
    Accepted: { description: Accepted for asynchronous processing }
    NoContent: { description: No content }
    Redirect: { description: Redirect }
    SwitchingProtocols: { description: Protocol upgrade (WebSocket) }
    NotImplemented: { description: Not implemented yet }
    Unauthorized:
      description: Authentication required or failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found or not in caller scope (never 403, to avoid existence leaks)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Validation failed or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but refused (e.g. mfa_required, email_not_verified, role_above_actor, forbidden_origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict (e.g. product_exists, environment_exists, last_owner, already_member)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; see Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
