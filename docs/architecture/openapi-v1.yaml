openapi: 3.1.0
info:
  title: Product Control Plane API
  version: 0.1.0-draft
  description: >
    Draft v1 contract (master plan M0.4). Request and response schemas are added by the milestone that implements each route; every route already declares its security. Sources: spec §15 and workbooks WB-01 to WB-17.
servers:
  - url: https://app.example.com
    description: Dashboard and user API
tags:
  - name: identity
  - name: organizations
  - name: members
  - name: audit
  - name: products
  - name: notifications
  - name: connections
  - name: agents
  - name: packs
  - name: logs
  - name: agent-protocol
  - name: ingest
  - name: internal
  - name: webhooks
  - name: assets
  - name: telemetry
  - name: incidents
  - name: ai
  - name: reports
  - name: actions
paths:
  /api/v1/auth/signup:
