        statusMessage: { type: [string, 'null'] }
        policyVersion: { type: integer }
        appliedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    Inventory:
      type: object
      required: [collectedAt, services, listeners, warnings]
      properties:
        collectedAt: { type: string, format: date-time }
        services:
          type: array
          items:
            type: object
            required: [pack, name, ports, processCount, evidence]
            properties:
              pack: { type: string }
              name: { type: string }
              ports: { type: array, items: { $ref: '#/components/schemas/ListenAddress' } }
              processCount: { type: integer }
              evidence: { type: array, items: { type: string } }
        listeners: { type: array, items: { $ref: '#/components/schemas/ListenAddress' } }
        warnings:
          type: array
          items:
            type: object
            required: [kind, pack, address, port]
            properties:
              kind: { type: string, enum: [exposed_service] }
              pack: { type: string }
              address: { type: string }
              port: { type: integer }
    ListenAddress:
      type: object
      required: [address, port]
      properties:
        address: { type: string }
        port: { type: integer }
    MetricPoint:
      type: array
      description: '[epochSeconds, value]; value is null for a step without data (never shown as zero)'
      minItems: 2
      maxItems: 2
      items: { type: [number, 'null'] }
  responses:
    Ok: { description: Success }
    Created: { description: Created }
    Accepted: { description: Accepted for asynchronous processing }
    NoContent: { description: No content }
    Redirect: { description: Redirect }
    SwitchingProtocols: { description: Protocol upgrade (WebSocket) }
    NotImplemented: { description: Not implemented yet }
    Unauthorized:
      description: Authentication required or failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found or not in caller scope (never 403, to avoid existence leaks)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Validation failed or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but refused (e.g. mfa_required, email_not_verified, role_above_actor, forbidden_origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict (e.g. product_exists, environment_exists, last_owner, already_member)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; see Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
