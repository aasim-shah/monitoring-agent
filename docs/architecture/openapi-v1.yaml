  /api/v1/actions/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getAction
      tags: [actions]
      summary: Action with approvals and executions
      description: Requires `incident.view`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M16
  /api/v1/actions/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: approveAction
      tags: [actions]
      summary: Approve
      description: >-
        By a member holding one of the policy's approver roles. In production the approver must differ from the
        requester (403 self_approval). Purge-everything needs two approvers. A complete approval issues a new signed
        10-minute task, or waits while another action runs on the same target.
