openapi: 3.1.0
info:
  title: Product Control Plane API
  version: 0.1.0-draft
  description: >
    Draft v1 contract (master plan M0.4). Request and response schemas are added by the milestone that implements each route; every route already declares its security. Sources: spec §15 and workbooks WB-01 to WB-17.
servers:
  - url: https://app.example.com
    description: Dashboard and user API
tags:
  - name: identity
  - name: organizations
  - name: members
  - name: audit
  - name: products
  - name: notifications
  - name: connections
  - name: agents
  - name: packs
  - name: logs
  - name: websites
  - name: agent-protocol
  - name: ingest
  - name: internal
  - name: webhooks
  - name: assets
  - name: telemetry
  - name: incidents
  - name: ai
  - name: reports
  - name: actions
  - name: kpis
paths:
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      tags: [identity]
      summary: Sign up with email and password
      description: Sign up with email and password.
      security: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
  /api/v1/auth/verify:
    post:
      operationId: authVerify
      tags: [identity]
      summary: Verify email address
      description: Verify email address.
      security: []
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [identity]
      summary: Log in with password
      description: Log in with password.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags: [identity]
      summary: Log out
      description: Log out.
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/auth/mfa/enroll:
    post:
      operationId: authMfaEnroll
      tags: [identity]
      summary: Start TOTP enrollment
      description: Start TOTP enrollment.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
  /api/v1/auth/mfa/verify:
    post:
      operationId: authMfaVerify
      tags: [identity]
      summary: Verify TOTP code
      description: Verify TOTP code.
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
  /api/v1/auth/password/reset-request:
    post:
      operationId: authPasswordResetRequest
      tags: [identity]
      summary: Request password reset email
      description: Request password reset email.
      security: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /api/v1/auth/password/reset:
    post:
      operationId: authPasswordReset
      tags: [identity]
      summary: Reset password with token
      description: Reset password with token.
      security: []
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /api/v1/auth/google/start:
    get:
      operationId: authGoogleStart
      tags: [identity]
      summary: Start Google login (openid email profile only)
      description: Start Google login (openid email profile only).
      security: []
      responses:
        '302':
          description: Success
      x-implemented-in: M2
  /api/v1/auth/google/callback:
    get:
      operationId: authGoogleCallback
      tags: [identity]
      summary: Google login callback
      description: Google login callback.
      security: []
      responses:
        '302':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implemented-in: M2
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Current user and memberships
      description: Current user and memberships.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization
      description: Create organization.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
  /api/v1/organizations/{orgId}:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization
      description: Get organization.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implemented-in: M2
    delete:
      operationId: requestOrganizationDeletion
      tags: [organizations]
      summary: Request organization deletion (30-day grace)
      description: >-
        Owner only, with the organization name typed back. Members lose access at once; agents are
        revoked and connections disconnected; the purge runs after 30 days. Requires `org.delete`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              additionalProperties: false
              properties:
                confirmName: { type: string }
      responses:
        '202':
          description: Deletion scheduled
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M19
  /api/v1/organizations/{orgId}/deletion/cancel:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: cancelOrganizationDeletion
      tags: [organizations]
      summary: Cancel pending deletion
      description: >-
        Restores member access during the grace period. Agents and connections stay revoked and must be
        enrolled or reconnected. Requires `org.delete`.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M19
  /api/v1/organizations/{orgId}/export:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: exportOrganization
      tags: [organizations]
      summary: Export organization data
      description: >-
        Queues a JSON archive of the organization (configuration, assets, incidents, reports, audit log;
        no secrets). One export is built at a time. Requires `org.export` (owners).
      security: [{ sessionCookie: [] }]
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                type: object
                required: [id, status, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M19
    get:
      operationId: listOrganizationExports
      tags: [organizations]
      summary: The latest 10 exports and their state
      description: The latest 10 exports and their state. Requires `org.export`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [exports]
                properties:
                  exports:
                    type: array
                    items:
                      type: object
                      required: [id, status, sizeBytes, error, expiresAt, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [queued, ready, failed, expired] }
                        sizeBytes: { type: [integer, 'null'] }
                        error: { type: [string, 'null'] }
                        expiresAt: { type: [string, 'null'], format: date-time }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M19
  /api/v1/organizations/{orgId}/export/{exportId}/download:
    parameters:
      - { $ref: '#/components/parameters/orgId' }
      - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadOrganizationExport
      tags: [organizations]
      summary: Download an export archive (gzip JSON) while its 24-hour link is valid
      description: 409 while it is being built, 410 once expired. Requires `org.export`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The archive
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not ready yet
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: Link expired
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
      x-implemented-in: M19
  /api/v1/organizations/{orgId}/usage:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: getTelemetryUsage
      tags: [organizations]
      summary: Telemetry usage, limits, and refusals
      description: >-
        Samples, active series, and refused requests as the ingest gateway saw them, in hourly (24h) or
        daily (7d) buckets; `overLimitSince` is set while refusals happened in the last hour. Requires
        `org.view`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [24h, 7d], default: 24h } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [range, buckets, totals, limits, overLimitSince]
                properties:
                  range: { type: string }
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [start, samples, activeSeries, refusedRequests]
                      properties:
                        start: { type: string, format: date-time }
                        samples: { type: number }
                        activeSeries: { type: integer }
                        refusedRequests: { type: integer }
                  totals:
                    type: object
                    required: [samples, activeSeries, refusedRequests]
                    properties:
                      samples: { type: number }
                      activeSeries: { type: integer }
                      refusedRequests: { type: integer }
                  limits:
                    type: object
                    required: [agentSeries, tenantSeries, agentSamplesPerSecond]
                    properties:
                      agentSeries: { type: integer }
                      tenantSeries: { type: integer }
                      agentSamplesPerSecond: { type: integer }
                  overLimitSince: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M10
  /api/v1/organizations/{orgId}/settings:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    patch:
      operationId: updateOrganizationSettings
      tags: [organizations]
      summary: Update organization settings
      description: Update organization settings.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
  /api/v1/organizations/{orgId}/settings/ai:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: getAiSettings
      tags: [ai]
      summary: AI settings
      description: Whether AI is on for the organization and which platform provider answers. Requires `org.view`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M14
    patch:
      operationId: updateAiSettings
      tags: [ai]
      summary: Turn the AI assistant on or off
      description: With AI off, AI endpoints answer 409 and dashboards, alerts, and reports keep working. Requires `org.settings.manage`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M14
  /api/v1/organizations/{orgId}/invitations:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: createInvitation
      tags: [members]
      summary: Invite member
      description: Invite member.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [members]
      summary: Accept invitation
      description: Accept invitation.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/organizations/{orgId}/members:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: listMembers
      tags: [members]
      summary: List members
      description: List members.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/organizations/{orgId}/members/{memberId}:
    parameters: [{ $ref: '#/components/parameters/orgId' }, { $ref: '#/components/parameters/memberId' }]
    patch:
      operationId: updateMember
      tags: [members]
      summary: Change role or product scope
      description: Change role or product scope.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove member
      description: Remove member.
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
  /api/v1/organizations/{orgId}/audit-logs:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      description: List audit log entries.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          required: false
          description: Opaque cursor from a previous page (nextBefore)
          schema:
            type: string
  /api/v1/organizations/{orgId}/products:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      description: Create product.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
    get:
      operationId: listProducts
      tags:
        - products
      summary: List products the caller may see
      description: List products the caller may see (product-scoped members see only their products).
      security:
        - sessionCookie: []
      x-implemented-in: M3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organizations/{orgId}/notification-channels:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: listNotificationChannels
      tags: [notifications]
      summary: List notification channels
      description: Channels never include secrets (Slack URLs, webhook URLs, signing secrets). Requires `org.view`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [channels],
                  properties:
                    {
                      channels: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } },
                    },
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M12
    post:
      operationId: createNotificationChannel
      tags: [notifications]
      summary: Create notification channel
      description: >-
        Email (1–10 recipients), Slack (incoming webhook URL), or a generic webhook. URLs must be https and resolve to
        public addresses. A webhook's signing secret is returned once. Requires `org.settings.manage`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [email, slack, webhook] }
                name: { type: string, maxLength: 80 }
                recipients: { type: array, items: { type: string, format: email }, maxItems: 10 }
                url: { type: string, format: uri }
                escalation: { type: boolean }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                {
                  allOf:
                    [
                      { $ref: '#/components/schemas/NotificationChannel' },
                      { type: object, properties: { signingSecret: { type: string } } },
                    ],
                }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M12
