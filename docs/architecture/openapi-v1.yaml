openapi: 3.1.0
info:
  title: Product Control Plane API
  version: 0.1.0-draft
  description: >
    Draft v1 contract (master plan M0.4). Request and response schemas are added by the milestone that implements each route; every route already declares its security. Sources: spec §15 and workbooks WB-01 to WB-17.
servers:
  - url: https://app.example.com
    description: Dashboard and user API
tags:
  - name: identity
  - name: organizations
  - name: members
  - name: audit
  - name: products
  - name: notifications
  - name: connections
  - name: agents
  - name: packs
  - name: logs
  - name: agent-protocol
  - name: ingest
  - name: internal
  - name: webhooks
  - name: assets
  - name: telemetry
  - name: incidents
  - name: ai
  - name: reports
  - name: actions
paths:
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      tags: [identity]
      summary: Sign up with email and password
      description: Sign up with email and password.
      security: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
  /api/v1/auth/verify:
    post:
      operationId: authVerify
      tags: [identity]
      summary: Verify email address
      description: Verify email address.
      security: []
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [identity]
      summary: Log in with password
      description: Log in with password.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags: [identity]
      summary: Log out
      description: Log out.
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/auth/mfa/enroll:
    post:
      operationId: authMfaEnroll
      tags: [identity]
      summary: Start TOTP enrollment
      description: Start TOTP enrollment.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
  /api/v1/auth/mfa/verify:
    post:
      operationId: authMfaVerify
      tags: [identity]
      summary: Verify TOTP code
      description: Verify TOTP code.
      security: [{ sessionCookie: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
  /api/v1/auth/password/reset-request:
    post:
      operationId: authPasswordResetRequest
      tags: [identity]
      summary: Request password reset email
      description: Request password reset email.
      security: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /api/v1/auth/password/reset:
    post:
      operationId: authPasswordReset
      tags: [identity]
      summary: Reset password with token
      description: Reset password with token.
      security: []
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /api/v1/auth/google/start:
    get:
      operationId: authGoogleStart
      tags: [identity]
      summary: Start Google login (openid email profile only)
      description: Start Google login (openid email profile only).
      security: []
      responses:
        '302':
          description: Success
      x-implemented-in: M2
  /api/v1/auth/google/callback:
    get:
      operationId: authGoogleCallback
      tags: [identity]
      summary: Google login callback
      description: Google login callback.
      security: []
      responses:
        '302':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implemented-in: M2
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Current user and memberships
      description: Current user and memberships.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization
      description: Create organization.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
  /api/v1/organizations/{orgId}:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization
      description: Get organization.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implemented-in: M2
    delete:
      operationId: requestOrganizationDeletion
      tags: [organizations]
      summary: Request organization deletion (30-day grace)
      description: Request organization deletion (30-day grace).
      security: [{ sessionCookie: [] }]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{orgId}/deletion/cancel:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: cancelOrganizationDeletion
      tags: [organizations]
      summary: Cancel pending deletion
      description: Cancel pending deletion.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{orgId}/export:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: exportOrganization
      tags: [organizations]
      summary: Export organization data
      description: Export organization data.
      security: [{ sessionCookie: [] }]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{orgId}/settings:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    patch:
      operationId: updateOrganizationSettings
      tags: [organizations]
      summary: Update organization settings
      description: Update organization settings.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
  /api/v1/organizations/{orgId}/settings/ai:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    patch:
      operationId: updateAiSettings
      tags: [ai]
      summary: Configure AI provider, model, or disable AI
      description: Configure AI provider, model, or disable AI.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{orgId}/invitations:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: createInvitation
      tags: [members]
      summary: Invite member
      description: Invite member.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [members]
      summary: Accept invitation
      description: Accept invitation.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/organizations/{orgId}/members:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: listMembers
      tags: [members]
      summary: List members
      description: List members.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/organizations/{orgId}/members/{memberId}:
    parameters: [{ $ref: '#/components/parameters/orgId' }, { $ref: '#/components/parameters/memberId' }]
    patch:
      operationId: updateMember
      tags: [members]
      summary: Change role or product scope
      description: Change role or product scope.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove member
      description: Remove member.
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
  /api/v1/organizations/{orgId}/audit-logs:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      description: List audit log entries.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          required: false
          description: Opaque cursor from a previous page (nextBefore)
          schema:
            type: string
  /api/v1/organizations/{orgId}/products:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      description: Create product.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
    get:
      operationId: listProducts
      tags:
        - products
      summary: List products the caller may see
      description: List products the caller may see (product-scoped members see only their products).
      security:
        - sessionCookie: []
      x-implemented-in: M3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organizations/{orgId}/notification-channels:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    get:
      operationId: listNotificationChannels
      tags: [notifications]
      summary: List notification channels
      description: List notification channels.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createNotificationChannel
      tags: [notifications]
      summary: Create notification channel
      description: Create notification channel.
      security: [{ sessionCookie: [] }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notification-channels/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: testNotificationChannel
      tags: [notifications]
      summary: Send test notification
      description: Send test notification.
      security: [{ sessionCookie: [] }]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/products/{productId}:
    parameters: [{ $ref: '#/components/parameters/productId' }]
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product
      description: Get product.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/products/{productId}/environments:
    parameters: [{ $ref: '#/components/parameters/productId' }]
    post:
      operationId: createEnvironment
      tags: [products]
      summary: Create environment
      description: Create environment.
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implemented-in: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
  /api/v1/products/{productId}/overview:
    parameters: [{ $ref: '#/components/parameters/productId' }]
    get:
      operationId: getProductOverview
      tags: [products]
      summary: Product overview
      description: Product overview.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOverview'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M2
  /api/v1/connectors/catalog:
    get:
      operationId: getConnectorCatalog
      tags: [connections]
      summary: Connector catalog with capabilities, credential fields, and config schema
      description: Connector catalog with capabilities, credential fields, and config schema.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCatalog'
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-implemented-in: M4
  /api/v1/organizations/{orgId}/connections:
    parameters: [{ $ref: '#/components/parameters/orgId' }]
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create connection (draft)
      description: Create connection (draft). Requires `connection.configure`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M4
    get:
      operationId: listConnections
      tags: [connections]
      summary: Connections visible to the caller (product-scoped members see scoped ones only)
      description: Connections visible to the caller (product-scoped members see scoped ones only). Requires `connection.view`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M4
  /api/v1/connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getConnection
      tags: [connections]
      summary: Connection detail (never includes credentials)
      description: Connection detail (never includes credentials). Requires `connection.view`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M4
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete connection (crypto-shred secrets; status disconnected)
      description: Delete connection (crypto-shred secrets; status disconnected). Requires `connection.configure`.
      security: [{ sessionCookie: [] }]
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDeleted'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-implemented-in: M4
  /api/v1/connections/{id}/authorize:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: authorizeConnection
      tags: [connections]
      summary: Store encrypted credentials and queue validation
      description: Store encrypted credentials and queue validation. Requires `connection.configure`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeConnectionRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-implemented-in: M4
  /api/v1/oauth/{provider}/callback:
    parameters: [{ $ref: '#/components/parameters/provider' }]
    get:
      operationId: oauthCallback
      tags: [connections]
      summary: Provider OAuth callback (state + PKCE validated)
      description: Provider OAuth callback (state + PKCE validated).
      security: [{ sessionCookie: [] }]
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/connections/{id}/validate:
    parameters: [{ $ref: '#/components/parameters/id' }]
